<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday</title>
    <!-- 準備ができるまで中身を隠す（素のHTMLが一瞬見えるのを防ぐ） -->
    <style>
      html { background: #F4EBD9; }
      body:not(.ready) { visibility: hidden; }
      body:not(.ready) * { transition: none !important; }
    </style>
  </head>
  <body>
<main class="stage" id="stage">
  <svg class="fx" id="fx"></svg>
  <div class="page" id="page"></div>

  <nav class="controls" id="controls">
    <button class="nav" id="prev" aria-label="前のページ">‹</button>
    <p class="counter" id="counter"></p>
    <button class="nav" id="next" aria-label="次のページ">›</button>
  </nav>
</main>

<div class="book-wrap pop-dots" id="bookWrap">
  <div class="book" id="book">
    <div class="half left" id="left"></div>
   <div class="half right" id="right"><p class="leaf-text" id="rightText"></p></div>
    <div class="sheet" id="sheet">
      <div class="face front" id="front">
        <!-- 表紙の絵（表紙のときだけ表示） -->
        <div class="cover-art">
          <!-- タイトル：ギザギザの爆発フキダシ＋フチ取り文字 -->
          <div class="cover-head">
            <svg class="cover-burst" viewBox="0 0 200 200" aria-hidden="true">
              <polygon points="100,10 115,36 139,19 141,48 170,44 159,71 188,80 166,100 188,120 159,129 170,156 141,152 139,181 115,164 100,190 85,164 61,181 59,152 30,156 41,129 12,120 34,100 12,80 41,71 30,44 59,48 61,19 85,36"
                fill="#F7C21B" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
            </svg>
            <h1 class="cover-title pop-outline" id="coverTitle">Happy<br>Birthday!</h1>
          </div>

          <!-- ケーキ：太い黒線＋3色＋ドットの影 -->
          <svg class="cover-cake" viewBox="0 0 200 170" aria-hidden="true">
            <defs>
              <pattern id="dotRed" width="6" height="6" patternUnits="userSpaceOnUse">
                <circle cx="3" cy="3" r="1.6" fill="#E63B2E"/>
              </pattern>
              <pattern id="dotInk" width="6" height="6" patternUnits="userSpaceOnUse">
                <circle cx="3" cy="3" r="1.5" fill="#111" opacity="0.55"/>
              </pattern>
            </defs>
            <g stroke="#111" stroke-linejoin="round" stroke-linecap="round">
              <!-- キラキラ -->
              <g fill="#F7C21B" stroke-width="2">
                <path transform="translate(24,40)" d="M0,-10 L2.5,-2.5 L10,0 L2.5,2.5 L0,10 L-2.5,2.5 L-10,0 L-2.5,-2.5Z"/>
                <path transform="translate(178,30)" d="M0,-8 L2,-2 L8,0 L2,2 L0,8 L-2,2 L-8,0 L-2,-2Z"/>
                <path transform="translate(182,86)" d="M0,-6 L1.5,-1.5 L6,0 L1.5,1.5 L0,6 L-1.5,1.5 L-6,0 L-1.5,-1.5Z"/>
              </g>
              <!-- お皿 -->
              <ellipse cx="100" cy="155" rx="90" ry="11" fill="#F4EBD9" stroke-width="4"/>
              <!-- 下の段 -->
              <rect x="28" y="100" width="144" height="54" rx="6" fill="#F7C21B" stroke="none"/>
              <rect x="134" y="100" width="38" height="54" fill="url(#dotRed)" stroke="none"/>
              <rect x="28" y="100" width="144" height="54" rx="6" fill="none" stroke-width="4"/>
              <path d="M28,106 Q28,100 34,100 H166 Q172,100 172,106 V112 Q166,122 160,112 Q152,126 144,112 Q136,120 128,112 Q120,128 112,112 Q104,120 96,112 Q88,126 80,112 Q72,120 64,112 Q56,126 48,112 Q40,120 28,112 Z" fill="#F4EBD9" stroke-width="3"/>
              <g fill="#E63B2E" stroke-width="2.5">
                <circle cx="52" cy="136" r="5"/><circle cx="76" cy="136" r="5"/><circle cx="100" cy="136" r="5"/><circle cx="124" cy="136" r="5"/><circle cx="148" cy="136" r="5"/>
              </g>
              <!-- 上の段 -->
              <rect x="55" y="58" width="90" height="42" rx="6" fill="#E63B2E" stroke="none"/>
              <rect x="120" y="58" width="25" height="42" fill="url(#dotInk)" stroke="none"/>
              <rect x="55" y="58" width="90" height="42" rx="6" fill="none" stroke-width="4"/>
              <path d="M55,64 Q55,58 61,58 H139 Q145,58 145,64 V70 Q139,79 133,70 Q125,81 117,70 Q109,77 101,70 Q93,81 85,70 Q77,77 69,70 Q62,79 55,70 Z" fill="#F4EBD9" stroke-width="3"/>
              <!-- ろうそく -->
              <g fill="#2CA5D9" stroke-width="3">
                <rect x="76" y="34" width="9" height="24" rx="2"/>
                <rect x="96" y="28" width="9" height="30" rx="2"/>
                <rect x="116" y="34" width="9" height="24" rx="2"/>
              </g>
              <g class="flame" transform="translate(80.5,33)">
                <path d="M0,0 C-7,-7 -5,-15 0,-22 C5,-15 7,-7 0,0Z" fill="#F7C21B" stroke-width="2.5"/>
                <path d="M0,-3 C-3,-6 -2,-10 0,-13 C2,-10 3,-6 0,-3Z" fill="#E63B2E" stroke="none"/>
              </g>
              <g class="flame" transform="translate(100.5,27)">
                <path d="M0,0 C-7,-7 -5,-15 0,-22 C5,-15 7,-7 0,0Z" fill="#F7C21B" stroke-width="2.5"/>
                <path d="M0,-3 C-3,-6 -2,-10 0,-13 C2,-10 3,-6 0,-3Z" fill="#E63B2E" stroke="none"/>
              </g>
              <g class="flame" transform="translate(120.5,33)">
                <path d="M0,0 C-7,-7 -5,-15 0,-22 C5,-15 7,-7 0,0Z" fill="#F7C21B" stroke-width="2.5"/>
                <path d="M0,-3 C-3,-6 -2,-10 0,-13 C2,-10 3,-6 0,-3Z" fill="#E63B2E" stroke="none"/>
              </g>
            </g>
          </svg>

          <!-- 「タップしてひらいてね」：コミックのフキダシ -->
          <p class="hint">タップしてひらいてね</p>
        </div>
        <p class="leaf-text" id="frontText"></p>
      </div>

      <div class="face back" id="back"></div>
    </div>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
  </body>
</html>
